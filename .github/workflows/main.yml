name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Write app/src/main/java/com/blackscreen/tv/MainActivity.java
        run: |
          mkdir -p app/src/main/java/com/blackscreen/tv
          echo '' | base64 -d > app/src/main/java/com/blackscreen/tv/MainActivity.java

      - name: Write app/src/main/AndroidManifest.xml
        run: |
          mkdir -p app/src/main
          echo '' | base64 -d > app/src/main/AndroidManifest.xml

      - name: Write app/src/main/res/values/strings.xml
        run: |
          mkdir -p app/src/main/res/values
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5CbGFjayBTY3JlZW48L3N0cmluZz48L3Jlc291cmNlcz4=' | base64 -d > app/src/main/res/values/strings.xml

      - name: Write app/build.gradle
        run: |
          mkdir -p app
          echo '' | base64 -d > app/build.gradle

      - name: Write build.gradle
        run: |
          mkdir -p .
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMS40JyBhcHBseSBmYWxzZQp9' | base64 -d > build.gradle

      - name: Write settings.gradle
        run: |
          mkdir -p .
          echo '' | base64 -d > settings.gradle

      - name: Write gradle/wrapper/gradle-wrapper.properties
        run: |
          mkdir -p gradle/wrapper
          echo 'ZGlzdHJpYnV0aW9uQmFzZT1HUkFETEVfVVNFUl9IT01FCmRpc3RyaWJ1dGlvblBhdGg9d3JhcHBlci9kaXN0cwpkaXN0cmlidXRpb25Vcmw9aHR0cHNcOi8vc2VydmljZXMuZ3JhZGxlLm9yZy9kaXN0cmlidXRpb25zL2dyYWRsZS04LjQtYmluLnppcAp6aXBTdG9yZUJhc2U9R1JBRExFX1VTRVJfSE9NRQp6aXBTdG9yZVBhdGg9d3JhcHBlci9kaXN0cw==' | base64 -d > gradle/wrapper/gradle-wrapper.properties

      - name: Create icon PNG
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          python3 -c "
import struct,zlib
w,h=48,48
raw=b''.join(b'\x00'+b'\x00\x00\x00'*w for _ in range(h))
cd=zlib.compress(raw,9)
ih=struct.pack('>IIBBBBB',w,h,8,2,0,0,0)
def ck(t,d):
  c=t+d;return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
open('app/src/main/res/mipmap-hdpi/ic_launcher.png','wb').write(b'\x89PNG\r\n\x1a\n'+ck(b'IHDR',ih)+ck(b'IDAT',cd)+ck(b'IEND',b''))
"

      - name: Setup Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.4/bin/gradle wrapper
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackScreen-TV
          path: app/build/outputs/apk/debug/app-debug.apk
