name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/blackscreen/tv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

      - name: Write MainActivity.java
        run: |
          cat > app/src/main/java/com/blackscreen/tv/MainActivity.java << 'JAVA'
          package com.blackscreen.tv;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  View v = new View(this);
                  v.setBackgroundColor(0xFF000000);
                  setContentView(v);
                  hideSystemUI();
              }
              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
              @Override
              public boolean onKeyDown(int k, KeyEvent e) {
                  finish();
                  return true;
              }
          }
          JAVA

      - name: Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.blackscreen.tv">
              <uses-feature android:name="android.software.leanback" android:required="true"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <application
                  android:label="Black Screen"
                  android:banner="@drawable/banner"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

      - name: Write strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Black Screen</string></resources>
          XML

      - name: Generate banner PNG
        run: |
          python3 -c "
          import struct, zlib
          w,h=320,180
          px=[[[0,0,0]]*w for _ in range(h)]
          raw=b''
          for row in px:
              raw+=b'\x00'
              for c in row: raw+=bytes(c)
          cdata=zlib.compress(raw,9)
          ihdr=struct.pack('>IIBBBBB',w,h,8,2,0,0,0)
          def chunk(t,d):
              c=t+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',ihdr)+chunk(b'IDAT',cdata)+chunk(b'IEND',b'')
          open('app/src/main/res/drawable/banner.png','wb').write(png)
          "

      - name: Write build files
        run: |
          cat > app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.blackscreen.tv'
              compileSdk 34
              defaultConfig {
                  applicationId "com.blackscreen.tv"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          GRADLE

          cat > build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          GRADLE

          cat > settings.gradle << 'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BlackScreenTV"
          include ':app'
          GRADLE

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS

      - name: Setup Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.4/bin/gradle wrapper
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackScreen-TV
          path: app/build/outputs/apk/debug/app-debug.apk
