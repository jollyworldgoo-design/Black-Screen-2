name: Build Android TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write settings.gradle
        run: |
          echo '' | base64 -d > settings.gradle

      - name: Write build.gradle
        run: |
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMS40JyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > build.gradle

      - name: Write gradle/wrapper/gradle-wrapper.properties
        run: |
          mkdir -p gradle/wrapper
          echo 'ZGlzdHJpYnV0aW9uQmFzZT1HUkFETEVfVVNFUl9IT01FCmRpc3RyaWJ1dGlvblBhdGg9d3JhcHBlci9kaXN0cwpkaXN0cmlidXRpb25Vcmw9aHR0cHNcOi8vc2VydmljZXMuZ3JhZGxlLm9yZy9kaXN0cmlidXRpb25zL2dyYWRsZS04LjQtYmluLnppcAp6aXBTdG9yZUJhc2U9R1JBRExFX1VTRVJfSE9NRQp6aXBTdG9yZVBhdGg9d3JhcHBlci9kaXN0cwo=' | base64 -d > gradle/wrapper/gradle-wrapper.properties

      - name: Write app/build.gradle
        run: |
          mkdir -p app
          echo '' | base64 -d > app/build.gradle

      - name: Write app/src/main/AndroidManifest.xml
        run: |
          mkdir -p app/src/main
          echo '' | base64 -d > app/src/main/AndroidManifest.xml

      - name: Write app/src/main/java/com/blackscreen/tv/MainActivity.java
        run: |
          mkdir -p app/src/main/java/com/blackscreen/tv
          echo '' | base64 -d > app/src/main/java/com/blackscreen/tv/MainActivity.java

      - name: Write app/src/main/res/values/strings.xml
        run: |
          mkdir -p app/src/main/res/values
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPkJsYWNrIFNjcmVlbjwvc3RyaW5nPgo8L3Jlc291cmNlcz4K' | base64 -d > app/src/main/res/values/strings.xml

      - name: Write app/src/main/res/drawable-xhdpi/tv_banner.png
        run: |
          mkdir -p app/src/main/res/drawable-xhdpi
          echo '' | base64 -d > app/src/main/res/drawable-xhdpi/tv_banner.png

      - name: Write app/src/main/res/mipmap-hdpi/ic_launcher.png
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          echo 'iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAIAAADYYG7QAAAAHUlEQVR42u3BAQEAAACCIP+vbkhAAQAAAAAAwK8BGzAAAVZsJ8oAAAAASUVORK5CYII=' | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Install Gradle 8.4 and generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.4/bin/gradle wrapper --gradle-version 8.4 --project-dir .
          chmod +x gradlew
          echo "gradlew created: $(ls -la gradlew)"

      - name: Verify project structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== app/build.gradle ==="
          cat app/build.gradle
          echo "=== settings.gradle ==="
          cat settings.gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackScreen-AndroidTV
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
